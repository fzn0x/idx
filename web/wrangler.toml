name = "idx-web"
main = "src/worker.js"
compatibility_date = "2026-10-01"
account_id = "dc0fe1ceb2528b6e2318010e82a9505a"

# Only answer on the custom domain: no *.workers.dev URL, no preview URLs.
# The Worker also rejects any other Host header (see src/worker.js).
workers_dev = false
preview_urls = false

routes = [
  { pattern = "ihsg.midoriresearch.com", custom_domain = true },
]

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "404-page"
# The docs (/docs, /llms*.txt) pass through the Worker for the charset and
# CORS of the Markdown files; every other asset gets its headers from
# public/_headers.
run_worker_first = ["/api/*", "/healthz", "/docs", "/docs/*", "/llms.txt", "/llms-full.txt"]

# The docs pages, llms.txt and llms-full.txt are generated from README.md and
# docs/*.md into public/ (gitignored) before every `wrangler dev` and
# `wrangler deploy`.
[build]
command = "node scripts/docs.mjs"
watch_dir = ["scripts", "../docs"]

[vars]
PUBLIC_HOST = "ihsg.midoriresearch.com"
# KSEI register mirror published by .github/workflows/ownership.yml.
OWN_MIRROR_URL = "https://github.com/fzn0x/idx/releases/download/ownership-data"
OWN_KEEP_RELEASES = "6"
# D1 free tier: 100k rows written per UTC day; the register takes ~22k per month
# loaded, and ~43k to replace a month D1 already holds (the delete counts too).
OWN_DAILY_WRITE_BUDGET = "60000"

[[d1_databases]]
binding = "DB"
database_name = "idx"
database_id = "f9359e42-2661-4757-b55b-1e8c19e7180f"
migrations_dir = "migrations"

# The minute cron (src/cron.js): the board refresh, which decides how much to
# do (every minute during IDX trading hours, WIB, every 15 minutes otherwise),
# a step of the KSEI register sync and one of the bandar scan, inside one
# subrequest budget per invocation.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
