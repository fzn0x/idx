<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>idx social card</title>
<!-- Source of public/og.png (1200x630). Not served; render with scripts/og.mjs.
     The station board of the site: black glass ground, 2px rules, an LED
     band set in Doto, everything else in Martian Mono, mint as the one lit
     circuit. Web fonts, so the render does not depend on installed fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:ROND,wght@100,700..900&family=Martian+Mono:wdth,wght@75..100,300..700&display=block">
<style>
  :root {
    --ground: #0b0f14; --rule: #1b242d; --ghost: #17202a; --dim: #8b98a5; --lit: #e6edf3; --mint: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    background: var(--ground); color: var(--lit);
    font-family: "Martian Mono", monospace; font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .bar { flex: none; height: 84px; display: flex; align-items: center; gap: 18px; padding: 0 52px; border-bottom: 2px solid var(--rule); }
  .bar img { width: 44px; height: 44px; display: block; }
  .bar .word { font-size: 38px; font-weight: 700; letter-spacing: -0.03em; }
  .bar .what { margin-left: 10px; font-size: 19px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); font-stretch: 87.5%; }
  .bar .url { margin-left: auto; font-size: 20px; color: var(--dim); font-stretch: 87.5%; }

  .band {
    flex: none; padding: 34px 52px 32px; border-bottom: 2px solid var(--rule);
    background-image: radial-gradient(circle at 3px 3px, var(--ghost) 2px, transparent 2.5px); background-size: 6px 6px;
  }
  .band .led { font-family: Doto, monospace; font-weight: 800; font-size: 124px; line-height: 0.9; letter-spacing: 0.02em; }
  .band .sub { margin-top: 18px; font-size: 30px; font-stretch: 87.5%; }

  table { width: 100%; border-collapse: collapse; }
  td { padding: 23px 0 22px; border-bottom: 2px solid var(--rule); font-size: 25px; white-space: nowrap; }
  td.no { width: 1%; padding-left: 52px; padding-right: 22px; color: var(--dim); font-size: 21px; font-weight: 600; }
  td.who { width: 230px; font-size: 21px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-stretch: 87.5%; }
  td.what { padding-right: 52px; text-align: right; color: var(--dim); font-stretch: 87.5%; }

  .status {
    margin-top: auto; flex: none; height: 58px; display: flex; align-items: center; gap: 22px; padding: 0 52px;
    border-top: 2px solid var(--rule); font-size: 19px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); font-stretch: 87.5%;
  }
  .status .lamp { display: inline-flex; align-items: center; gap: 12px; color: var(--lit); font-weight: 700; }
  .status .lamp::before { content: ""; width: 13px; height: 13px; background: var(--mint); }
</style>
</head>
<body>
  <header class="bar">
    <img src="../public/mark.svg" alt="">
    <span class="word">idx</span>
    <span class="what">Indonesian stock market · IDX / IHSG</span>
    <span class="url">ihsg.midoriresearch.com</span>
  </header>
  <section class="band">
    <p class="led">IDX STOCKS</p>
    <p class="sub">for people, scripts and AI agents</p>
  </section>
  <table>
    <tr><td class="no">01</td><td class="who">For people</td><td>idx stocks quote BBCA</td><td class="what">tables</td></tr>
    <tr><td class="no">02</td><td class="who">For scripts</td><td>idx -o json stocks quote BBCA</td><td class="what">JSON envelope</td></tr>
    <tr><td class="no">03</td><td class="who">For agents</td><td>idx mcp</td><td class="what">MCP server</td></tr>
  </table>
  <footer class="status"><span class="lamp">Live</span><span>minute board · free public data · no API keys · MIT</span></footer>
</body>
</html>
