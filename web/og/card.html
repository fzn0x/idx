<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>idx social card</title>
<!-- Source of public/og.png (1200x630). Not served; render with scripts/og.mjs.
     Halaman Bursa, light: the newsprint ground, the navy masthead with the
     mark, the headline in Libre Franklin 800 and everything else in Atkinson
     Hyperlegible Next, three plain lines on a white sheet, and the address over
     a 4px ink rule, as the site's footer signs off. No figures: the card never
     prints an IHSG value or a price. Web fonts, so the render does not depend
     on installed fonts. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&family=Libre+Franklin:wght@800&display=block">
<style>
  :root {
    --paper: #f3f4f1; --sheet: #ffffff; --rule: #cfd4cd; --ink: #15191e; --ink-2: #454e58;
    --navy: #123a64; --on-navy: #ffffff; --on-navy-2: #c9d6e6;
    --text: "Atkinson Hyperlegible Next", sans-serif; --head: "Libre Franklin", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    background: var(--paper); color: var(--ink);
    font-family: var(--text); font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  .mast { flex: none; height: 108px; display: flex; align-items: center; gap: 20px; padding: 0 64px; background: var(--navy); color: var(--on-navy); }
  .mast img { display: block; width: 64px; height: 64px; }
  .mast .name { display: grid; line-height: 1.05; }
  .mast b { font-family: var(--head); font-size: 46px; font-weight: 800; letter-spacing: -0.02em; }
  .mast small { margin-top: 3px; font-size: 21px; font-weight: 700; color: var(--on-navy-2); }

  .lead { flex: none; padding: 44px 64px 0; }
  h1 { font-family: var(--head); font-size: 84px; font-weight: 800; line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance; }
  .en { margin-top: 16px; font-size: 32px; color: var(--ink-2); }

  .lines {
    flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    margin: 34px 64px 0; background: var(--sheet); border: 2px solid var(--rule); border-radius: 4px;
  }
  .lines p { padding: 20px 24px 22px; font-size: 24px; line-height: 1.3; color: var(--ink-2); }
  .lines p + p { border-left: 2px solid var(--rule); }
  .lines p b { color: var(--ink); }

  .sign { margin: auto 64px 0; padding: 16px 0 28px; border-top: 4px solid var(--ink); font-size: 30px; font-weight: 800; letter-spacing: -0.005em; }
</style>
</head>
<body>
  <header class="mast">
    <img src="../public/mark.svg" alt="">
    <span class="name"><b>idx</b><small>oleh Midori Research</small></span>
  </header>
  <section class="lead">
    <h1>IHSG dan harga saham hari ini</h1>
    <p class="en" lang="en">IHSG and Indonesian stock prices today</p>
  </section>
  <div class="lines">
    <p><span><b>Gratis</b>, tanpa akun, data publik tertunda</span></p>
    <p><span><b>Bahasa Indonesia</b> dan bahasa Inggris</span></p>
    <p><span><b>CLI dan MCP</b> untuk pengembang</span></p>
  </div>
  <footer class="sign">ihsg.midoriresearch.com</footer>
</body>
</html>
