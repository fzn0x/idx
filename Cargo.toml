[package]
name = "ihsg-cli"
version = "0.8.1"
edition = "2021"
rust-version = "1.88"
description = "Indonesian stock market (IDX / IHSG) analysis: the `idx` CLI and MCP server for people and AI agents, free public data"
license = "MIT"
authors = ["Midori Research <desk@midoriresearch.com>"]
repository = "https://github.com/fzn0x/idx"
homepage = "https://ihsg.midoriresearch.com"
documentation = "https://github.com/fzn0x/idx#readme"
readme = "README.md"
keywords = ["ihsg", "idx", "stocks", "indonesia", "mcp"]
categories = ["command-line-utilities", "finance"]
# What crates.io gets: sources, the bundled issuer list, the fixture-based
# tests and the docs the README links to. No web/, npm/ or screenshots.
include = [
  "/src/**",
  "/data/**",
  "/tests/**",
  "/docs/*.md",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/Cargo.toml",
  "/Cargo.lock",
]

# The library keeps the short name so `use idx::...` and the binary stay `idx`.
[lib]
name = "idx"
path = "src/lib.rs"

[[bin]]
name = "idx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
async-trait = "0.1"
base64 = "0.22"
calamine = "0.37"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
comfy-table = "7"
dirs = "5"
futures = "0.3"
hex = "0.4"
pdf-extract = "0.12"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "http2"] }
rss = "2"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
terminal_size = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["signal", "rt-multi-thread", "macros", "net", "time", "process"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
