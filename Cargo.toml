[package]
name = "idx"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Indonesian stock market (IDX / IHSG) analysis CLI and MCP server, built for humans and AI agents"
license = "MIT"
repository = "https://github.com/fzn0x/idx"
homepage = "https://ihsg.midoriresearch.com"
readme = "README.md"
keywords = ["idx", "ihsg", "stocks", "finance", "mcp"]
categories = ["command-line-utilities", "finance"]
publish = false

[[bin]]
name = "idx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
calamine = "0.36"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
comfy-table = "8"
dirs = "5"
futures = "0.3"
hex = "0.4"
pdf-extract = "0.12"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "http2"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
