name: nix

# The flake (flake.nix): package, apps, dev shell and checks (fmt, clippy,
# tests, the declared MSRV, a packaged-binary smoke). Runs on main and on pull
# requests that touch what the flake builds from (its `src` fileset plus the
# flake and toolchain files), so a test that needs the network, an embedded
# file outside the fileset or syntax newer than the MSRV fails before merge;
# ci.yml stays the fast gate for everything else.
# Run it by hand with `update` set to refresh the flake inputs (AGENTS.md).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - rustfmt.toml
      - src/**
      - data/**
      - tests/**
      - .github/workflows/nix.yml
  workflow_dispatch:
    inputs:
      update:
        description: Update the flake inputs (nix flake update); the run fails until its flake-lock artifact is committed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Writes flake.lock when it is missing (the first run after flake.nix
      # lands); with a committed lock it changes nothing, unless the run was
      # started by hand with `update`, which moves every input to its latest
      # revision. The steps below then build with the new lock.
      - name: Lock the inputs
        env:
          UPDATE: ${{ inputs.update }}
        run: |
          if [ "$UPDATE" = true ]; then nix flake update; else nix flake lock; fi

      - name: Upload flake.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
          if-no-files-found: error

      # Only x86_64-linux is built below; this catches evaluation errors in
      # the aarch64-linux and aarch64-darwin outputs.
      - name: Evaluate every system
        run: nix flake check --all-systems --no-build

      - name: nix flake check
        run: nix flake check -L

      - name: nix build and run
        run: |
          want="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          nix build -L .#idx
          ./result/bin/idx version
          nix run .#idx -- version | tee version.txt
          grep -q "^idx $want " version.txt
          nix run . -- --help >/dev/null
          nix run .#mcp -- --help >/dev/null
          ls result/share/bash-completion/completions result/share/zsh/site-functions result/share/fish/vendor_completions.d

      - name: dev shell has the toolchain and node
        run: nix develop -c sh -c 'cargo --version && rustfmt --version && cargo clippy --version && rust-analyzer --version && node --version'

      # Last, so the build above still runs on the first push: a lock that
      # is missing or out of date fails here, and the artifact holds the one
      # to commit (gh run download <run-id> -n flake-lock, after deleting the
      # old flake.lock: gh does not overwrite files).
      # (Nix adds a lock it creates with `git add -N`, so ask HEAD, not the index.)
      - name: flake.lock is committed and current
        run: |
          git cat-file -e HEAD:flake.lock 2>/dev/null || { echo "::error::flake.lock is not committed: download the flake-lock artifact of this run and commit it"; exit 1; }
          git diff --exit-code HEAD -- flake.lock || { echo "::error::flake.lock is out of date: commit the flake-lock artifact of this run"; exit 1; }
