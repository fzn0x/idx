name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: idx

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl,  cross: true,  archive: tar.gz }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true,  archive: tar.gz }
          - { os: macos-latest,  target: x86_64-apple-darwin,         cross: false, archive: tar.gz }
          - { os: macos-latest,  target: aarch64-apple-darwin,        cross: false, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     cross: false, archive: zip }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Version from tag
        id: v
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="${BIN}-${{ steps.v.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/${BIN}.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/${BIN}" "dist/$name/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            asset="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          rm -rf "$name"
          ls -la

      - name: Smoke the binary
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${BIN}"
          [ -f "$bin" ] || bin="$bin.exe"
          "$bin" version
          "$bin" --offline -o json stocks quote BBCA || test $? -eq 5

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes from CHANGELOG
        id: notes
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          awk -v ver="$ver" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") || index($0, "[Unreleased]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $tag" > notes.md
          echo "Install: \`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh\`" >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS

  npm:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Set version from tag
        working-directory: npm
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          npm version --no-git-tag-version "${tag#v}"
      - run: npm publish --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
