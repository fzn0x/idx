name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo run -- --help

  web:
    name: web (node tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test web/test/*.mjs
      - run: node --check web/src/worker.js
      - name: Versions agree (Cargo.toml, package.json, npm/package.json)
        run: |
          cargo_ver="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          root_ver="$(node -p "require('./package.json').version")"
          npm_ver="$(node -p "require('./npm/package.json').version")"
          echo "Cargo.toml $cargo_ver · package.json $root_ver · npm/package.json $npm_ver"
          [ "$cargo_ver" = "$root_ver" ] && [ "$cargo_ver" = "$npm_ver" ] || { echo "versions differ: bump all three together"; exit 1; }
